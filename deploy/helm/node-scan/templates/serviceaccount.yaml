{{- if .Values.dispatcher.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "node-scan.serviceAccountName" . }}
  labels:
    {{- include "node-scan.labels" . | nindent 4 }}
  {{- with .Values.dispatcher.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
