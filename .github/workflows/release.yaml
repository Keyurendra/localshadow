name: Release Pipeline

# yamllint disable-line rule:truthy
on:
  push:
    paths-ignore:
      - 'README.md'
      - '**/*.md'
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v6.0.0
        with:
          go-version-file: go.mod
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_DEV_ACCESS_ID }}
          aws-secret-access-key: ${{ secrets.AWS_DEV_SECRET_ID }}
          aws-region: us-east-1
      - name: Release and Push Blobs to S3
        if: startsWith(github.ref, 'refs/tags/')
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
      - name: Build and Push Blobs to S3 under `latest`
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GOEXPERIMENT: jsonv2
        run: |-
          mkdir -p ./build/latest

          for os in linux windows; do
              for arch in amd64 arm64; do
                  echo "building for $os $arch"
                  path="./build/latest/omni-$os-$arch"
                  if [[ "$os" == "windows" ]]; then
                      path="${path}.exe"
                  fi
                  GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "$path" ./cmd/omni
              done
          done

          echo "pushing blobs to s3..."
          aws s3 sync ./build/ s3://accuknox-omni/
