name: Release Pipeline

# yamllint disable-line rule:truthy
on:
  push:
    paths-ignore:
      - 'README.md'
      - '**/*.md'
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

env:
  GITHUB_TOKEN: ${{ secrets.GH_ORG_TOKEN }}
  GOPRIVATE: "github.com/accuknox/*"
  GOEXPERIMENT: jsonv2
  GOTOOLCHAIN: local

jobs:
  lint:
    runs-on: omni-telemetry
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6.0.0
        with:
          go-version-file: go.mod

      - name: Include a GH token in the URL when interacting with GH repos
        run: git config --global url.https://$GITHUB_TOKEN@github.com/.insteadOf https://github.com/

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
  release:
    runs-on: omni-telemetry
    needs:
      - lint
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6.0.0
        with:
          go-version-file: go.mod

      - name: Include a GH token in the URL when interacting with GH repos
        run: git config --global url.https://$GITHUB_TOKEN@github.com/.insteadOf https://github.com/

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_DEV_ACCESS_ID }}
          aws-secret-access-key: ${{ secrets.AWS_DEV_SECRET_ID }}
          aws-region: us-east-1

      - name: Release and Push Blobs to S3
        if: startsWith(github.ref, 'refs/tags/')
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean

      - name: Build and Push Blobs to S3 under `latest`
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |-
          mkdir -p ./build/main

          for os in linux windows; do
              for arch in amd64 arm64; do
                  echo "building for $os $arch"
                  path="./build/main/omni-$os-$arch"
                  if [[ "$os" == "windows" ]]; then
                      path="${path}.exe"
                  fi
                  GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "$path" ./cmd/omni
              done
          done

          echo "pushing blobs to s3..."
          aws s3 sync ./build/ s3://accuknox-omni/

  docker:
    runs-on: omni-telemetry
    needs:
      - lint
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_DEV_ACCESS_ID }}
          aws-secret-access-key: ${{ secrets.AWS_DEV_SECRET_ID }}
          aws-region: us-east-1

      - name: Login to Amazon ECR Public
        run: |
          aws ecr-public get-login-password --region us-east-1 | \
            docker login --username AWS --password-stdin public.ecr.aws

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Determine image tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      - name: Build and push omni-operator image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.omni-operator
          push: true
          tags: |
            public.ecr.aws/k9v9d5v2/omni-operator:latest
            ${{ steps.tag.outputs.tag != 'latest' && format('public.ecr.aws/k9v9d5v2/omni-operator:{0}', steps.tag.outputs.tag) || '' }}
          secrets: |
            gh_token=${{ secrets.GH_ORG_TOKEN }}
          cache-from: type=gha,scope=omni-operator
          cache-to: type=gha,scope=omni-operator,mode=max

      - name: Build and push omni image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.omni
          push: true
          tags: |
            public.ecr.aws/k9v9d5v2/omni:latest
            ${{ steps.tag.outputs.tag != 'latest' && format('public.ecr.aws/k9v9d5v2/omni:{0}', steps.tag.outputs.tag) || '' }}
          secrets: |
            gh_token=${{ secrets.GH_ORG_TOKEN }}
          cache-from: type=gha,scope=omni
          cache-to: type=gha,scope=omni,mode=max
