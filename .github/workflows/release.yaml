name: Release Pipeline

# yamllint disable-line rule:truthy
on:
  push:
    paths-ignore:
      - 'README.md'
      - '**/*.md'
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

env:
  GITHUB_TOKEN: ${{ secrets.GH_ORG_TOKEN }}
  GOPRIVATE: "github.com/accuknox/*"
  GOEXPERIMENT: jsonv2
  GOTOOLCHAIN: local
  AK_ENDPOINT: "https://cspm.accuknox.com"
  AK_SAST_LABEL: "AKREPOSAST"  

jobs:
  lint:
    runs-on: omni-telemetry
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6.0.0
        with:
          go-version-file: go.mod

      - name: Include a GH token in the URL when interacting with GH repos
        run: git config --global url.https://$GITHUB_TOKEN@github.com/.insteadOf https://github.com/

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
  release:
    runs-on: omni-telemetry
    needs:
      - lint
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6.0.0
        with:
          go-version-file: go.mod

      - name: Include a GH token in the URL when interacting with GH repos
        run: git config --global url.https://$GITHUB_TOKEN@github.com/.insteadOf https://github.com/

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_DEV_ACCESS_ID }}
          aws-secret-access-key: ${{ secrets.AWS_DEV_SECRET_ID }}
          aws-region: us-east-1

      - name: Release and Push Blobs to S3
        if: startsWith(github.ref, 'refs/tags/')
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean

      - name: Build and Push Blobs to S3 under `latest`
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |-
          mkdir -p ./build/main

          for os in darwin linux windows; do
              for arch in amd64 arm64; do
                  echo "building for $os $arch"
                  path="./build/main/omni-$os-$arch"
                  if [[ "$os" == "windows" ]]; then
                      path="${path}.exe"
                  fi
                  GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "$path" ./cmd/omni
              done
          done

          echo "pushing blobs to s3..."
          aws s3 sync ./build/ s3://accuknox-omni/

  sonarqube-code-scan:
    runs-on: runner
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Run AccuKnox SAST
        uses: accuknox/accuknox-code-analysis@v1.0.0
        with:
          scan_type: "sast"
          accuknox_token: ${{ secrets.AK_PROD_ACCUKNOXTECH_TOKEN }}
          accuknox_endpoint: ${{ env.AK_ENDPOINT }}
          accuknox_label: ${{ env.AK_SAST_LABEL }}
          sast_command: "."
          sast_severity: "HIGH,CRITICAL"
          soft_fail: true
          upload_artifact: true

      - name: Verify and Extract Vulnerability Counts
        run: |
          ls -lh
          RESULT_FILE=$(ls results*.json 2>/dev/null | head -n1)

          if [ -z "$RESULT_FILE" ]; then
            echo "No SAST results file found, defaulting counts to 0"
            echo "CRITICAL_VULNS=0" >> $GITHUB_ENV
            echo "HIGH_VULNS=0" >> $GITHUB_ENV
            echo "MEDIUM_VULNS=0" >> $GITHUB_ENV
            echo "LOW_VULNS=0" >> $GITHUB_ENV
            exit 0
          fi

          cp "$RESULT_FILE" sast-scan-results.json

          CRITICAL_COUNT=$(jq '[.results[]? | select(.extra.metadata.impact=="CRITICAL")] | length' sast-scan-results.json 2>/dev/null || echo 0)
          HIGH_COUNT=$(jq '[.results[]? | select(.extra.metadata.impact=="HIGH")] | length' sast-scan-results.json 2>/dev/null || echo 0)
          MEDIUM_COUNT=$(jq '[.results[]? | select(.extra.metadata.impact=="MEDIUM")] | length' sast-scan-results.json 2>/dev/null || echo 0)
          LOW_COUNT=$(jq '[.results[]? | select(.extra.metadata.impact=="LOW")] | length' sast-scan-results.json 2>/dev/null || echo 0)

          echo "CRITICAL_VULNS=$CRITICAL_COUNT" >> $GITHUB_ENV
          echo "HIGH_VULNS=$HIGH_COUNT" >> $GITHUB_ENV
          echo "MEDIUM_VULNS=$MEDIUM_COUNT" >> $GITHUB_ENV
          echo "LOW_VULNS=$LOW_COUNT" >> $GITHUB_ENV

      - name: Publish Release with Attached Artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          append_body: true
          body: |

            ---
            ## 🔍 SAST Scan Results

            The static application security testing report generated by OpenGrep is attached for this release.

            * **Project:** `${{ github.event.repository.name }}`
            * **🚨 Critical Findings:** `${{ env.CRITICAL_VULNS }}`
            * **⚠️ High Findings:** `${{ env.HIGH_VULNS }}`
            * **🟠 Medium Findings:** `${{ env.MEDIUM_VULNS }}`
            * **🟡 Low Findings:** `${{ env.LOW_VULNS }}`

          files: |
            sast-scan-results.json
          
  docker-image-scan:
    runs-on: omni-telemetry
    needs:
      - lint
    steps:
      - name: Checkout source
        uses: accuknox/common-gh-actions/actions/checkout-source@main

      - name: Set up Go
        uses: actions/setup-go@v6.0.0
        with:
          go-version-file: go.mod

      - name: Include a GH token in the URL when interacting with GH repos
        run: git config --global url.https://$GITHUB_TOKEN@github.com/.insteadOf https://github.com/        

      - name: Docker build and Trivy scan (omni-operator)
        uses: accuknox/common-gh-actions/actions/docker-scan@main
        with:
          docker_context: .
          dockerfile_path: docker/Dockerfile.omni-operator
          repository_name: public.ecr.aws/k9v9d5v2
          image_name: omni-operator
          tag: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          label: "DGFD"
          cspm_endpoint: "cspm.accuknox.com"
          cspm_token: ${{ secrets.AK_PROD_ACCUKNOXTECH_TOKEN }}
          tenant_id: ${{ secrets.AK_PROD_ACCUKNOXTECH_TENANT_ID }}
          disable_scan: false
      - name: Verify and Extract Vulnerability Counts
        run: |
          ls -lh
          cp results.json container-scan-results-omnioperator.json
          test -f container-scan-results-omnioperator.json
          
          # Parse the JSON to count CRITICAL and HIGH vulnerabilities
          CRITICAL_COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' container-scan-results-omnioperator.json 2>/dev/null || echo 0)
          HIGH_COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' container-scan-results-omnioperator.json 2>/dev/null || echo 0)
          MEDIUM_COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="MEDIUM")] | length' container-scan-results-omnioperator.json 2>/dev/null || echo 0)
          LOW_COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="LOW")] | length' container-scan-results-omnioperator.json 2>/dev/null || echo 0)
          UNKNOWN_COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="UNKNOWN")] | length' container-scan-results-omnioperator.json 2>/dev/null || echo 0)
          SECRET_COUNT=$(jq '[.Results[]?.Secrets[]?] | length' container-scan-results-omnioperator.json 2>/dev/null || echo 0)
          
          # Export them to GitHub Environment variables so the release step can read them
          echo "CRITICAL_VULNS=$CRITICAL_COUNT" >> $GITHUB_ENV
          echo "HIGH_VULNS=$HIGH_COUNT" >> $GITHUB_ENV
          echo "MEDIUM_VULNS=$MEDIUM_COUNT" >> $GITHUB_ENV
          echo "LOW_VULNS=$LOW_COUNT" >> $GITHUB_ENV
          echo "UNKNOWN_VULNS=$UNKNOWN_COUNT" >> $GITHUB_ENV
          echo "SECRET_VULNS=$SECRET_COUNT" >> $GITHUB_ENV

      # Attach to Release with counts included in the body
      - name: Publish Release with Attached Artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          append_body: true 
          body: |
            
            ---
            ## 🐳 Container Vulnerability Scan Results
            
            The container vulnerability scan report generated by Trivy is attached for this release.
            
            * **Image:** `public.ecr.aws/k9v9d5v2/omni-operator:${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}`
            * **🚨 Critical Vulnerabilities:** `${{ env.CRITICAL_VULNS }}`
            * **⚠️ High Vulnerabilities:** `${{ env.HIGH_VULNS }}`
            * **🟠 Medium Vulnerabilities:** `${{ env.MEDIUM_VULNS }}`
            * **🔵 Low Vulnerabilities:** `${{ env.LOW_VULNS }}`
            * **⚪ Unknown Vulnerabilities:** `${{ env.UNKNOWN_VULNS }}`
            * **🔑 Secrets Found:** `${{ env.SECRET_VULNS }}`
          files: |
            container-scan-results-omnioperator.json

      - name: Docker build and Trivy scan (omni)
        uses: accuknox/common-gh-actions/actions/docker-scan@main
        with:
          docker_context: .
          dockerfile_path: docker/Dockerfile.omni
          repository_name: public.ecr.aws/k9v9d5v2
          image_name: omni
          tag: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          label: "DGFD"
          cspm_endpoint: "cspm.accuknox.com"
          cspm_token: ${{ secrets.AK_PROD_ACCUKNOXTECH_TOKEN }}
          tenant_id: ${{ secrets.AK_PROD_ACCUKNOXTECH_TENANT_ID }}
          disable_scan: false
      - name: Verify and Extract Vulnerability Counts
        run: |
          ls -lh
          cp results.json container-scan-results-omni.json
          test -f container-scan-results-omni.json
          
          # Parse the JSON to count CRITICAL and HIGH vulnerabilities
          CRITICAL_COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' container-scan-results-omni.json 2>/dev/null || echo 0)
          HIGH_COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' container-scan-results-omni.json 2>/dev/null || echo 0)
          MEDIUM_COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="MEDIUM")] | length' container-scan-results-omni.json 2>/dev/null || echo 0)
          LOW_COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="LOW")] | length' container-scan-results-omni.json 2>/dev/null || echo 0)
          UNKNOWN_COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="UNKNOWN")] | length' container-scan-results-omni.json 2>/dev/null || echo 0)
          SECRET_COUNT=$(jq '[.Results[]?.Secrets[]?] | length' container-scan-results-omni.json 2>/dev/null || echo 0)
          
          # Export them to GitHub Environment variables so the release step can read them
          echo "CRITICAL_VULNS=$CRITICAL_COUNT" >> $GITHUB_ENV
          echo "HIGH_VULNS=$HIGH_COUNT" >> $GITHUB_ENV
          echo "MEDIUM_VULNS=$MEDIUM_COUNT" >> $GITHUB_ENV
          echo "LOW_VULNS=$LOW_COUNT" >> $GITHUB_ENV
          echo "UNKNOWN_VULNS=$UNKNOWN_COUNT" >> $GITHUB_ENV
          echo "SECRET_VULNS=$SECRET_COUNT" >> $GITHUB_ENV

      # Attach to Release with counts included in the body
      - name: Publish Release with Attached Artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          append_body: true 
          body: |
            
            ---
            ## 🐳 Container Vulnerability Scan Results
            
            The container vulnerability scan report generated by Trivy is attached for this release.
            
            * **Image:** `public.ecr.aws/k9v9d5v2/omni:${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}`
            * **🚨 Critical Vulnerabilities:** `${{ env.CRITICAL_VULNS }}`
            * **⚠️ High Vulnerabilities:** `${{ env.HIGH_VULNS }}`
            * **🟠 Medium Vulnerabilities:** `${{ env.MEDIUM_VULNS }}`
            * **🔵 Low Vulnerabilities:** `${{ env.LOW_VULNS }}`
            * **⚪ Unknown Vulnerabilities:** `${{ env.UNKNOWN_VULNS }}`
            * **🔑 Secrets Found:** `${{ env.SECRET_VULNS }}`
          files: |
            container-scan-results-omni.json
  docker:
    runs-on: omni-telemetry
    needs:
      - lint
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_DEV_ACCESS_ID }}
          aws-secret-access-key: ${{ secrets.AWS_DEV_SECRET_ID }}
          aws-region: us-east-1

      - name: Login to Amazon ECR Public
        run: |
          aws ecr-public get-login-password --region us-east-1 | \
            docker login --username AWS --password-stdin public.ecr.aws

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Determine image tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag=$(git describe --tags --exact-match)
          else
            tag=latest
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build and push omni-operator image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.omni-operator
          push: true
          tags: |
            public.ecr.aws/k9v9d5v2/omni-operator:latest
            ${{ steps.tag.outputs.tag != 'latest' && format('public.ecr.aws/k9v9d5v2/omni-operator:{0}', steps.tag.outputs.tag) || '' }}
          build-args: |
            VERSION=${{ steps.tag.outputs.tag }}
          secrets: |
            gh_token=${{ secrets.GH_ORG_TOKEN }}
          cache-from: type=gha,scope=omni-operator
          cache-to: type=gha,scope=omni-operator,mode=max

      - name: Build and push omni image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.omni
          push: true
          tags: |
            public.ecr.aws/k9v9d5v2/omni:latest
            ${{ steps.tag.outputs.tag != 'latest' && format('public.ecr.aws/k9v9d5v2/omni:{0}', steps.tag.outputs.tag) || '' }}
          secrets: |
            gh_token=${{ secrets.GH_ORG_TOKEN }}
          cache-from: type=gha,scope=omni
          cache-to: type=gha,scope=omni,mode=max
  #========== Malware Scan ==========
  malware-scan-omni:
    runs-on: runner
    needs: [docker]
    if: github.ref_type == 'tag'
    permissions:
      contents: write
      actions: read
    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_DEV_ACCESS_ID }}
        aws-secret-access-key: ${{ secrets.AWS_DEV_SECRET_ID }}
        aws-region: us-east-2
        
    - name: Login to ECR
      uses: aws-actions/amazon-ecr-login@v1
      with:
        registry-type: private
        
    - name: Run AccuKnox Malware Scan
      uses: accuknox/malware-scan@v1
      with:
        repository_name: public.ecr.aws/k9v9d5v2/omni
        tag: ${{ github.ref_name }}

    - name: Verify and Prepare Scan Result
      run: |
        ls -lh
        test -f malware-scan-results-omni.json
        THREAT_COUNT=$(jq '.summary.threats_found' malware-scan-results-omni.json 2>/dev/null || echo 0)
        echo "THREAT_COUNT=$THREAT_COUNT" >> $GITHUB_ENV
        cat malware-scan-results-omni.json

    - name: Publish Release with Attached Artifacts
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        append_body: true
        tag_name: ${{ github.ref_name }}
        body: |
          
          ---
          ## 🛡️ Malware Scan Results Attached
            
          The malware scan report generated by ClamAV is attached for this release.
            
          * **Image:** `public.ecr.aws/k9v9d5v2/omni:${{ github.ref_name }}`
          * **🦠 Malware Threats Found:** `${{ env.THREAT_COUNT }}`
            
        files: |
          malware-scan-results-omni.json
  malware-scan-omnioperator:
    runs-on: runner
    needs: [malware-scan-omni]
    if: github.ref_type == 'tag'
    permissions:
      contents: write
      actions: read
    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_DEV_ACCESS_ID }}
        aws-secret-access-key: ${{ secrets.AWS_DEV_SECRET_ID }}
        aws-region: us-east-2
        
    - name: Login to ECR
      uses: aws-actions/amazon-ecr-login@v1
      with:
        registry-type: private
        
    - name: Run AccuKnox Malware Scan
      uses: accuknox/malware-scan@v1
      with:
        repository_name: public.ecr.aws/k9v9d5v2/omni-operator
        tag: ${{ github.ref_name }}

    - name: Verify and Prepare Scan Result
      run: |
        ls -lh
        test -f malware-scan-results-omni-operator.json
        THREAT_COUNT=$(jq '.summary.threats_found' malware-scan-results-omni-operator.json 2>/dev/null || echo 0)
        echo "THREAT_COUNT=$THREAT_COUNT" >> $GITHUB_ENV
        cat malware-scan-results-omni-operator.json

    - name: Publish Release with Attached Artifacts
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        append_body: true
        tag_name: ${{ github.ref_name }}
        body: |
          
          ---
          ## 🛡️ Malware Scan Results Attached
            
          The malware scan report generated by ClamAV is attached for this release.
            
          * **Image:** `public.ecr.aws/k9v9d5v2/omni:${{ github.ref_name }}`
          * **🦠 Malware Threats Found:** `${{ env.THREAT_COUNT }}`
            
        files: |
          malware-scan-results-omni-operator.json
