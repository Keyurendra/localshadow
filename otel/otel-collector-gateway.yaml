apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: otel-collector-gateway
  namespace: istio-system
spec:
  secretName: otel-collector-gateway-tls
  dnsNames:
    - otel.omni.accuknox.com
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
