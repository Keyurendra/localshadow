---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: scans.omni.accuknox.com
spec:
  group: omni.accuknox.com
  names:
    kind: Scan
    listKind: ScanList
    plural: scans
    singular: scan
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Virtual machine being scanned
      jsonPath: .spec.virtualMachineName
      name: VM
      type: string
    - description: Current phase of the scan
      jsonPath: .status.phase
      name: Phase
      type: string
    - description: Time since creation
      jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Scan is the Schema for the scans API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec defines the desired state of Scan
            properties:
              artifactAPI:
                description: |-
                  AccuKnox Artifact API configuration. Resulting scan artifacts are
                  published to this endpoint.
                properties:
                  endpoint:
                    description: AccuKnox artifact api endpoint.
                    type: string
                  label:
                    description: Label to be assosciated with the resulting scan findings.
                    type: string
                  tenantID:
                    description: AccuKnox platform tenancy ID
                    type: integer
                  token:
                    description: JWT auth token for the artifact API.
                    properties:
                      secretRef:
                        description: Reference to the Secret containing the token.
                        properties:
                          key:
                            description: Key within the Secret to select.
                            type: string
                          name:
                            description: Name of the referent Secret.
                            type: string
                        required:
                        - key
                        - name
                        type: object
                    required:
                    - secretRef
                    type: object
                required:
                - endpoint
                - label
                - tenantID
                - token
                type: object
              backoffLimit:
                default: 6
                description: |-
                  BackoffLimit is the number of retries before marking the job failed.
                  Defaults to 6.
                format: int32
                type: integer
              clusterName:
                description: |-
                  Unique identifier for your cluster. This name will be used as the asset
                  name for scan findings on the AccuKnox platform.
                minLength: 1
                type: string
              image:
                description: |-
                  Image is the container image to use.
                  More info: https://kubernetes.io/docs/concepts/containers/images
                type: string
              imagePullPolicy:
                description: |-
                  ImagePullPolicy defines how the image is pulled.
                  One of Always, Never, IfNotPresent.
                  Defaults to Always if :latest tag is specified, or IfNotPresent otherwise.
                enum:
                - Always
                - Never
                - IfNotPresent
                type: string
              resources:
                description: |-
                  Resources specifies compute resources required by the container.
                  More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                properties:
                  claims:
                    description: |-
                      Claims lists the names of resources, defined in spec.resourceClaims,
                      that are used by this container.

                      This is an alpha field and requires enabling the
                      DynamicResourceAllocation feature gate.

                      This field is immutable. It can only be set for containers.
                    items:
                      description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                      properties:
                        name:
                          description: |-
                            Name must match the name of one entry in pod.spec.resourceClaims of
                            the Pod where this field is used. It makes that resource available
                            inside a container.
                          type: string
                        request:
                          description: |-
                            Request is the name chosen for a request in the referenced claim.
                            If empty, everything from the claim is made available, otherwise
                            only the result of this request.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  limits:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Limits describes the maximum amount of compute resources allowed.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Requests describes the minimum amount of compute resources required.
                      If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                      otherwise to an implementation-defined value. Requests cannot exceed Limits.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                type: object
              skipMalwareScan:
                default: true
                description: |-
                  Skip malware scanning. Malware scanning can be CPU intensive. Disabled
                  by default.
                type: boolean
              virtualMachineName:
                description: VirtualMachineName is the name of the virtual machine
                  to be scanned.
                minLength: 1
                type: string
            required:
            - artifactAPI
            - clusterName
            - virtualMachineName
            type: object
          status:
            description: Status defines the observed state of Scan
            properties:
              completionTime:
                description: CompletionTime is the time at which the scan completed.
                format: date-time
                type: string
              conditions:
                description: Conditions represent the latest observations of the scan's
                  state.
                items:
                  description: ScanCondition describes a condition of a scan.
                  properties:
                    lastProbeTime:
                      description: Last time the condition was checked.
                      format: date-time
                      type: string
                    lastTransitionTime:
                      description: Last time the condition transit from one status
                        to another.
                      format: date-time
                      type: string
                    message:
                      description: Human readable message indicating details about
                        last transition.
                      type: string
                    reason:
                      description: (brief) reason for the condition's last transition.
                      type: string
                    status:
                      default: Unknown
                      description: Status of the condition.
                      enum:
                      - Unknown
                      - "True"
                      - "False"
                      type: string
                    type:
                      description: Type of scan condition.
                      type: string
                  required:
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              errors:
                description: Errors are a list of errors returned by the scanner on
                  (partial) failure.
                items:
                  description: ScanError represents an error encountered during scanning.
                  properties:
                    message:
                      description: Message provides details about the error.
                      type: string
                    type:
                      description: Type is the category of the error.
                      enum:
                      - Orchestration
                      - VulnScan
                      - MalwareScan
                      - ArtifactAPI
                      type: string
                  required:
                  - message
                  - type
                  type: object
                type: array
              identifiedOS:
                description: IdentifiedOS is the operating system identified by the
                  scanner.
                enum:
                - Unidentifiable
                - Linux
                - Windows
                type: string
              phase:
                default: Pending
                description: Phase represents the current phase of the scan.
                enum:
                - Unknown
                - Pending
                - Running
                - Succeeded
                - Failed
                type: string
              startTime:
                description: StartTime is the time at which the scan started.
                format: date-time
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
