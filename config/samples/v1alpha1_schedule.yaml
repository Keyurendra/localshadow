apiVersion: omni.accuknox.com/v1alpha1
kind: Schedule
metadata:
  labels:
    app.kubernetes.io/name: omni-operator
    app.kubernetes.io/managed-by: kustomize
  name: demo
spec:
  cronJobNamespace: default
  concurrency: 1
  schedule: "*/20 * * * *"
  timeZone: Asia/Kolkata
  artifactAPI:
    endpoint: https://cspm.dev.accuknox.com/api/v1/artifact/
    label: internal
    tenantID: 311
    token:
      secretRef:
        name: artifact-token
        key: token
  template:
    spec:
      clusterName: kubevirt-proxmox
      skipMalwareScan: true
      image: "public.ecr.aws/k9v9d5v2/omni:latest"
