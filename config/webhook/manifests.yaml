---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-omni-accuknox-com-v1alpha1-scan
  failurePolicy: Fail
  name: mscan-v1alpha1.kb.io
  rules:
  - apiGroups:
    - omni.accuknox.com
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - scans
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-omni-accuknox-com-v1alpha1-schedule
  failurePolicy: Fail
  name: mschedule-v1alpha1.kb.io
  rules:
  - apiGroups:
    - omni.accuknox.com
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - schedules
  sideEffects: None
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-omni-accuknox-com-v1alpha1-scan
  failurePolicy: Fail
  name: vscan-v1alpha1.kb.io
  rules:
  - apiGroups:
    - omni.accuknox.com
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - scans
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-omni-accuknox-com-v1alpha1-schedule
  failurePolicy: Fail
  name: vschedule-v1alpha1.kb.io
  rules:
  - apiGroups:
    - omni.accuknox.com
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - schedules
  sideEffects: None
