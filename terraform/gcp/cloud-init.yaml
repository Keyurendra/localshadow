package_update: true
package_upgrade: true
packages:
  - curl
  - trivy
  - clamav
  - libclamunrar

write_files:
  - path: /etc/accuknox-omni/artifact.token
    content: ${artifact_token}
    owner: root:root
    permissions: "0600"

  - path: /etc/systemd/system/omni.service
    content: |
      [Unit]
      Description=AccuKnox Omni
      After=network.target
      Wants=network.target

      [Service]
      Type=simple
      User=root
      ExecStart=/usr/local/bin/omni schedule gcp \
                  --artifact-token-file /etc/accuknox-omni/artifact.token \
                  --artifact-endpoint "${artifact_endpoint}" \
                  --tenant-id "${artifact_tenant_id}" \
                  --artifact-label "${artifact_label}" %{for key, value in omni_additional_flags}--${key}="${value}" %{endfor}
      Restart=always
      RestartSec=10
      StandardOutput=journal
      StandardError=journal
      SyslogIdentifier=accuknox-omni

      [Install]
      WantedBy=multi-user.target
    owner: root:root
    permissions: '0644'

runcmd:
  - |
    /bin/bash -c '
      set -euo pipefail
      mkdir -p /etc/accuknox-omni /usr/local/bin
      curl -L https://accuknox-omni.s3.us-east-1.amazonaws.com/latest/omni-linux-amd64 -o /usr/local/bin/omni
      chmod +x /usr/local/bin/omni
      systemctl daemon-reload
      systemctl enable omni.service --now
      systemctl status omni.service
    '

final_message: |
  Cloud-init setup complete!
  AccuKnox Omni service should be running.
  Check status with: systemctl status omni
  View logs with: journalctl -u omni -f
